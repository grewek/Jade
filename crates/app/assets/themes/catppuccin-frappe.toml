# Jade theme. Format: FORMAT.md. Roles come from roles.toml; only [palette] (and any [overrides]) differ.
format_version = 1
name = "Catppuccin Frappé"
kind = "dark"   # "light" or "dark"

[palette]
rosewater = "#f2d5cf"
flamingo  = "#eebebe"
pink      = "#f4b8e4"
mauve     = "#ca9ee6"
red       = "#e78284"
maroon    = "#ea999c"
peach     = "#ef9f76"
yellow    = "#e5c890"
green     = "#a6d189"
teal      = "#81c8be"
sky       = "#99d1db"
sapphire  = "#85c1dc"
blue      = "#8caaee"
lavender  = "#babbf1"
text      = "#c6d0f5"
subtext1  = "#b5bfe2"
subtext0  = "#a5adce"
overlay2  = "#949cbb"
overlay1  = "#838ba7"
overlay0  = "#737994"
surface2  = "#626880"
surface1  = "#51576d"
surface0  = "#414559"
base      = "#303446"
mantle    = "#292c3c"
crust     = "#232634"

[overrides]
# Syntax colors (#99): the Catppuccin editor scheme by hue name.
syntax_comment     = "overlay2"
syntax_string      = "green"
syntax_number      = "peach"
syntax_keyword     = "mauve"
syntax_function    = "blue"
syntax_type        = "yellow"
syntax_constant    = "sapphire"
syntax_operator    = "sky"
syntax_punctuation = "subtext0"
syntax_variable    = "flamingo"
