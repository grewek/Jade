# Jade theme. Format: FORMAT.md. Roles come from roles.toml; only [palette] (and any [overrides]) differ.
format_version = 1
name = "Catppuccin Latte"
kind = "light"   # "light" or "dark"

[palette]
rosewater = "#dc8a78"
flamingo  = "#dd7878"
pink      = "#ea76cb"
mauve     = "#8839ef"
red       = "#d20f39"
maroon    = "#e64553"
peach     = "#fe640b"
yellow    = "#df8e1d"
green     = "#40a02b"
teal      = "#179299"
sky       = "#04a5e5"
sapphire  = "#209fb5"
blue      = "#1e66f5"
lavender  = "#7287fd"
text      = "#4c4f69"
subtext1  = "#5c5f77"
subtext0  = "#6c6f85"
overlay2  = "#7c7f93"
overlay1  = "#8c8fa1"
overlay0  = "#9ca0b0"
surface2  = "#acb0be"
surface1  = "#bcc0cc"
surface0  = "#ccd0da"
base      = "#eff1f5"
mantle    = "#e6e9ef"
crust     = "#dce0e8"

# Latte's pastel accents are below 4.5:1 on its background. These roles are darkened
# (same hue, lower lightness) until they reach 4.5:1; every other role keeps roles.toml.
# text_muted is measured on background_secondary, accent on background.
[overrides]
text_muted  = "#65687d"
text_subtle = "#6a6d81"
link        = "#1761f5"
wikilink    = "#187787"
code        = "#327c21"
info        = "#1761f5"
tip         = "#13797e"
success     = "#327c21"
warning     = "#996114"
neutral     = "#6a6d81"
accent      = "#3d5afc"
