[package]
name = "jade-app"
version = "0.2.0"
edition = "2024"

[features]
# The Unix-socket debug server (`debug_server/`) that `jade-debug` drives.
# Off by default so the shipped binary has no input-injecting socket; tests
# always include it. It needs GPUI's test support for the headless mode, whose
# window can render itself to pixels (`JADE_DEBUG_HEADLESS`, see
# `debug_server/headless.rs`).
debug-socket = ["dep:jade-debug-protocol", "gpui-kit/test-support"]
# Headless GPUI harness (`headless.rs`) and allocation counting for the
# layout and allocation benches; they need gpui-kit's test platform.
bench-support = ["gpui-kit/test-support"]

[dependencies]
gpui-kit = "0.7"
jade-core = { path = "../core" }
jade-debug-protocol = { path = "../debug-protocol", optional = true }
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
dirs = "6.0"
notify = "8.2"
imagesize = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
ttf-parser = "0.25"

[dev-dependencies]
jade-debug-protocol = { path = "../debug-protocol" }
criterion = { version = "0.8.2", features = ["html_reports"] }
gpui-kit = { version = "0.7", features = ["test-support"] }
tempfile = "3.27.0"

[[bench]]
name = "editor"
harness = false

[[bench]]
name = "layout"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "allocations"
harness = false
required-features = ["bench-support"]

[lints]
workspace = true
